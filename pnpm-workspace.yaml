packages:
  - "apps/*"
  - "packages/*"
  - "services/*/*"

allowBuilds:
  esbuild: true
  kerberos: false
  protobufjs: true
  re2: true

peerDependencyRules:
  ignoreMissing:
    - kerberos

catalog:
  "@formisch/react": "^1.1.0"
  "@ngneat/falso": ^8.0.2
  "@playwright/test": 1.62.1
  "@types/node": ^26.6.5
  "@vitest/browser-playwright": ^5.0.3
  fastify: 5.12.5
  lucide-react: 1.54.0
  nodemailer: "npm:10.1.0"
  oxfmt: 0.61.0
  oxlint: 1.82.0
  playwright: 1.62.1
  resend: ^6.32.1
  tsdown: ^0.23.0
  typescript: ^6.0.3
  valibot: ^1.1.0
  vitest: ^5.0.3

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - fastify@5.12.7

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current
