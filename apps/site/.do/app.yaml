alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: ar-at-localhost.site
    type: PRIMARY
    zone: ar-at-localhost.site
envs:
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: ar-at-localhost
      match:
        authority:
          exact: ""
        path:
          prefix: /
name: site
region: sgp
static_sites:
  - build_command: pnpm --filter site build
    environment_slug: node-js
    github:
      branch: main
      deploy_on_push: false
      repo: ar-at-localhost/ar-at-localhost
    name: ar-at-localhost
    output_dir: apps/site/dist
    source_dir: /
