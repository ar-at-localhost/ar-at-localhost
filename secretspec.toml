[project]
name = "ar-at-localhost"
revision = "1.0"

[providers]
encrypted_file = "sops://secrets/{project}/{profile}.enc.yaml"
injected = "env"

[profiles.default]
ADMIN_NAME = { description = "Full name of the admin" }
ADMIN_EMAIL = { description = "Email of the admin" }
ADMIN_PASSWORD = { description = "Email of the admin" }
CI = { description = "CI Environment indication", default = "false", required = false }
CONTACT_PERSON_NAME = { description = "Name of the email alert receiver admin" }
CONTACT_PERSON_EMAIL = { description = "Email address of the alert receiver admin" }
CORS_ALLOW = { description = "Allowed origins for CORS (Comma separated)", default = "http://localhost:4321" }
DB_URI = { description = "Database URL", required = false, default = "postgresql://localhost:5432/ar-at-localhost" }
GCP_KEY = { description = "GCP Service Key file for access", required = false, encoding = "base64" }
HOST = { description = "Server (listen) address", default = "127.0.0.1" }
MAIL_FROM = { description = "Email server address", required = false }
MAIL_PORT = { description = "Email server port", required = false }
MAIL_PWD = { description = "Default system email password", required = false }
MAIL_SECURE = { description = "If the mail transport is secure?", required = false }
MAIL_SERVER = { description = "Email server address", required = false }
MAIL_USER = { description = "Default system email address", required = false }
NEON_PROJECT_ID = { description = "Neon project id", required = false }
NIX_CACHE_BUCKET = { description = "Attic s3 bucket name", required = false }
NIX_CACHE_BUCKET_KEY_ID = { description = "Attic s3 storage key id", required = false }
NIX_CACHE_BUCKET_KEY = { description = "Attic s3 storage secret key", required = false }
NIX_CACHE_BUCKET_REGION = { description = "Nix cache bucket region", required = false }
NIX_CACHE_KEY_PUB = { description = "Attic s3 bucket region", required = false }
NIX_CACHE_KEY_PRIV = { description = "Attic s3 bucket region", required = false }
NODE_ENV = { description = "Environment name", required = false }
PGADMIN_DEFAULT_DB_URI = { description = "pgadmin database uri", required = false, composed = "${DB_URI}" }
PGADMIN_DEFAULT_EMAIL = { description = "pgadmin access email", required = false }
PGADMIN_DEFAULT_PASSWORD = { description = "pgadmin access password", required = false }
PORT = { description = "Server port", required = false }
PUBLIC_SRV_AUTH_URL = { description = "Server address", default = "http://localhost:5002" }
PUBLIC_SRV_CONTACT_URL = { description = "Server address", default = "http://localhost:5001" }
PUBLIC_SRV_URL = { description = "Server address", default = "http://localhost:5000" }
PUBLIC_SITE_URL = { description = "Server address", default = "http://localhost:4321" }
PUBLIC_STAGE = { description = "Application stage (env)", default = "dev" }
PUBLIC_TURNSTILE_SITEKEY = { description = "Turnstile Site Key for human verification", required = false, default = "1x00000000000000000000AA" }
SITE_APP_ID = { description = "DigitalOcean site app id (used to deploy site)", required = false }
SRV_INT_URL = { description = "URL of internal service", required = false }
TURBO_TOKEN = { description = "Turborepo auth token for remote caching", required = false }
TURBO_TEAM = { description = "Turborepo team for remote caching", default = "ar-at-localhost", required = false }
TF_VAR_attic = { description = "Enable attic resources in terraform", default = "false" }
TF_VAR_domain_name = { description = "Domain Name (e.g.: ar-at-localhost.site)", required = false }
TF_VAR_jwt = { description = "JWT Secret", required = false }
TF_VAR_project_id = { description = "GCP project id", required = false }
TF_VAR_project_name = { description = "GCP project name", default = "ar-at-localhost" }
TF_VAR_project_number = { description = "GCP project number", required = false }
TF_VAR_region = { description = "GCP default region", required = false }
TF_VAR_secretspec_profile = { description = "Environment name", required = false }
TF_VAR_sops_age_key = { description = "GCP project id", required = false }
TF_VAR_zone = { description = "GCP default zone", required = false }
TURNSTILE_SECRET_KEY = { description = "Turnstile Secret Key for human verification", required = false, default = "1x0000000000000000000000000000000AA" }

[profiles.ci]
CI = { description = "CI Environment indication", default = "true" }
NEON_API_KEY = { description = "Neon API Key", required = false }
NEON_BASE = { description = "Neon base branch", required = false }
NEON_PROJECT_ID = { description = "Neon project id", required = false }
NODE_ENV = { default = "ci" }
PUBLIC_STAGE = { default = "ci" }
TF_VAR_secretspec_profile = { "default" = "ci" }

[profiles.staging]
HOST = { default = "0.0.0.0" }
NODE_ENV = { default = "staging" }
PUBLIC_STAGE = { default = "staging" }
TF_VAR_secretspec_profile = { "default" = "staging" }

[profiles.prod]
HOST = { default = "0.0.0.0" }
NODE_ENV = { default = "production" }
PUBLIC_STAGE = { default = "production" }
RESEND_API_KEY = { description = "Resend API key for outbound mails", required = true }
TF_VAR_secretspec_profile = { "default" = "prod" }

[profiles.ci.defaults]
providers = ["encrypted_file", "injected"]

[profiles.staging.defaults]
providers = ["encrypted_file", "injected"]

[profiles.default.defaults]
providers = ["encrypted_file", "injected"]
NODE_ENV = { default = "development" }

[profiles.prod.defaults]
providers = ["encrypted_file", "injected"]
