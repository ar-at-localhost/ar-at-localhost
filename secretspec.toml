[project]
name = "ar-at-localhost"
revision = "1.0"

[providers]
encrypted_file = "sops://secrets/{project}/{profile}.enc.yaml"
injected = "env"

[profiles.default]
CONTACT_PERSON_NAME = { description = "Name of the email alert receiver admin" }
CONTACT_PERSON_EMAIL = { description = "Email address of the alert receiver admin" }
CORS_ALLOW = { description = "Allowed origins for CORS (Comma separated)", default = "http://localhost:4321" }
DOCTL_TOKEN = { description = "Digital Ocean Token (for `doctl` CLI)", required = false }
HOST = { description = "Server (listen) address", default = "127.0.0.1" }
MAIL_FROM = { description = "Email server address", required = false }
MAIL_PORT = { description = "Email server port", required = false }
MAIL_PWD = { description = "Default system email password", required = false }
MAIL_SECURE = { description = "If the mail transport is secure?", required = false }
MAIL_SERVER = { description = "Email server address", required = false }
MAIL_USER = { description = "Default system email address", required = false }
MONGODB_DB = { description = "Database name", default = "default" }
MONGO_CRYPT_LIB = { description = "Mongocrypt shared library path", required = true }

MONGODB_DEK_CONTACT_EMAIL = { description = "Mongodb data encryption key for `contacts.email` (use CLI to create)", required = true, providers = [
  "encrypted_file",
] }

MONGODB_DEK_CONTACT_MESSAGE = { description = "Mongodb data encryption key for `contacts.message` (use CLI to create)", required = true, providers = [
  "encrypted_file",
] }

MONGODB_ENC_KEY = { description = "Database encryption key", required = true, providers = [
  "encrypted_file",
] }

MONGODB_URI = { description = "Database connection string", required = true, providers = [
  "encrypted_file",
] }

NODE_ENV = { description = "Environment name", default = "" }
PORT = { description = "Server port", default = "5000" }
PUBLIC_SRV_URL = { description = "Server address", default = "http://localhost:5000" }
SITE_APP_ID = { description = "DigitalOcean site app id (used to deploy site)", required = false }
SRV_SSH_HOST = { description = "Host Server name (used to deploy api server, e.g. 127.0.0.1)", required = false }
SRV_SSH_KEY = { description = "Host server ssh key (used to deploy api server )", required = false }
SRV_SSH_PATH = { description = "Host server repo path (used to deploy api server, e.g. /src/ar-at-localhost)", required = false }
SRV_SSH_USER = { description = "Host server user name (used to deploy api server, e.g. git)", required = false }
SSL_CERT_PATH = { description = "Path to SSL certificate full chain", required = false }
SSL_CERT_KEY_PATH = { description = "Path to SSL certificate private key", required = false }
TURBO_TOKEN = { description = "Turborepo auth token for remote caching", required = false }
TURBO_TEAM = { description = "Turborepo team for remote caching", default = "ar-at-localhost", required = false }

[profiles.ci]
NODE_ENV = { default = "ci" }

[profiles.ci.defaults]
providers = ["encrypted_file", "injected"]

[profiles.default.defaults]
providers = ["encrypted_file", "injected"]
MONGODB_DB = { default = "development" }
MONGODB_DEK_CONTACT_EMAIL = { default = "000000000000000000000000000000000000" }
MONGODB_DEK_CONTACT_MESSAGE = { default = "000000000000000000000000000000000000" }
MONGODB_URI = { default = "mongodb://localhost:27017/ar-at-localhost" }
NODE_ENV = { default = "development" }

[profiles.prod.defaults]
providers = ["encrypted_file", "injected"]

[profiles.prod]
CORS_ALLOW = { default = "https://ar-at-localhost.site" }
PUBLIC_SRV_URL = { default = "https://srv.ar-at-localhost.site" }
RESEND_API_KEY = { description = "Resend API key for outbound mails", required = true }
