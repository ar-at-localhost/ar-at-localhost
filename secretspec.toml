[project]
name = "ar-at-localhost"
revision = "1.0"

[providers]
encrypted_file = "sops://secrets/{project}/{profile}.enc.yaml"
injected = "env"

[profiles.default.defaults]
providers = ["encrypted_file", "injected"]

[profiles.ci.defaults]
providers = ["encrypted_file", "injected"]

[profiles.default]
MONGODB_DB = { description = "Database name", default = "default" }

MONGODB_DEK_CONTACT_EMAIL = { description = "Mongodb data encryption key for `contacts.email` (use CLI to create)", required = true, providers = [
  "encrypted_file",
] }

MONGODB_DEK_CONTACT_MESSAGE = { description = "Mongodb data encryption key for `contacts.message` (use CLI to create)", required = true, providers = [
  "encrypted_file",
] }

MONGODB_ENC_KEY = { description = "Database encryption key", required = true, providers = [
  "encrypted_file",
] }

MONGODB_URI = { description = "Database connection string", required = true, providers = [
  "encrypted_file",
] }

PORT = { description = "Server port", default = "5000" }
SRV_URL = { description = "Server address (without port)", default = "http://localhost" }

[profiles.dev]
MONGODB_DEK_CONTACT_EMAIL = { default = "000000000000000000000000000000000000" }
MONGODB_DEK_CONTACT_MESSAGE = { default = "000000000000000000000000000000000000" }
MONGODB_URI = { default = "mongodb://localhost:27017/ar-at-localhost" }
