name: Setup Nix
description: Installs nix, required programs and setups binary cache

inputs:
  age-key:
    required: true
  profile:
    default: "ci"
  skip-install:
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: cachix/install-nix-action@v31

    - name: Setup nix
      shell: bash
      run: |
        nix profile add nixpkgs#devenv .#gcloud nixpkgs#jq nixpkgs#rclone nixpkgs#sops

    - name: Prepare nix cache
      shell: bash
      run: |
        export CACHE_DIR="/nix-cache"
        sudo mkdir -p "$CACHE_DIR"
        sudo chown "$(id -u):$(id -g)" "$CACHE_DIR"
        echo "NIX_CACHE=$CACHE_DIR" >> "$GITHUB_ENV"

    - name: Cache nix binaries
      uses: actions/cache@v5
      with:
        path: /nix-cache
        key: nix-cache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          nix-cache-${{ runner.os }}-

    - name: Setup auth and nix cache
      shell: bash
      env:
        SECRETSPEC_PROFILE: ${{ inputs.profile }}
        SOPS_AGE_KEY: ${{ inputs.age-key }}

      run: |
        export credentials_file="$RUNNER_TEMP/gcp.json"
        export hook_script="${{ github.action_path }}/push-hook.sh"
        export hook_env="/etc/nix/push-hook.env"
        export signing_key="/etc/nix/signing-key"
        export GITHUB_ENV

        export port=$(node -e '
          const net = require("node:net");
          const server = net.createServer();

          server.listen(0, "127.0.0.1", () => {
            console.log(server.address().port)
            server.close()
          });
        ')

        secretspec run -- bash -c '
          set -euo pipefail
          umask 077
          echo "::add-mask::$GCP_KEY"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"
          echo "GCP_KEY=$GCP_KEY" >> "$GITHUB_ENV"
          printf "%s" "$GCP_KEY" > "$credentials_file"
          gcloud auth activate-service-account --key-file "$credentials_file" --quiet
        '

        secretspec run --profile ci -- bash -c '
          set -euo pipefail
          if [[ "${ATTIC:-}" == "true" ]]; then
            echo "> Installing build hook..."
            sudo install -m 755 "$hook_script" /etc/nix/push-hook.sh
            echo "| DONE: Installed build hook..."

            echo "> Installing private key..."
            printf "%s" "$ATTIC_KEY_PRIV" | sudo tee "$signing_key" >/dev/null
            sudo chmod 600 "$signing_key"
            echo "| DONE: Installed private key..."

            echo "> Installing environment..."
            {
              echo "ATTIC_BUCKET=$ATTIC_BUCKET"
              echo "ATTIC_BUCKET_REGION=$ATTIC_BUCKET_REGION"
              echo "AWS_ACCESS_KEY_ID=$ATTIC_BUCKET_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$ATTIC_BUCKET_KEY"
            } | sudo tee "$hook_env" >/dev/null
            sudo chmod 600 "$hook_env"
            echo "| DONE: Installed environment..."

            echo "> Configuring nix for cache for auto pushing to bucket..."
            {
              echo "post-build-hook = /etc/nix/push-hook.sh"
            } | sudo tee -a /etc/nix/nix.conf
            echo "> DONE: Configured nix for cache for auto pushing to bucket..."

            echo "> Restarting Nix Daemon(1) ..."
            sudo systemctl restart nix-daemon
            echo "| OK: Restarted Nix Daemon(1) ..."

            echo "> Building and pushing health package to ensure cache is initialized..."
            nix build .#health
            echo "| OK: Build health package. Cache should be ready."

            echo "> Starting binary cache server..."
            export RCLONE_S3_PROVIDER="GCS"
            export RCLONE_S3_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export RCLONE_S3_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export RCLONE_S3_ENDPOINT="https://storage.googleapis.com"
            setsid rclone serve http ":s3:$ATTIC_BUCKET" \
              --addr "127.0.0.1:$port" \
              --read-only \
              --no-modtime \
              --no-checksum \
              --vfs-cache-mode full \
              --vfs-cache-max-size 4G \
              --vfs-cache-max-age 8760h \
              --vfs-read-chunk-size 64M \
              --vfs-read-chunk-size-limit off \
              --dir-cache-time 5m \
              --s3-no-check-bucket \
              --cache-dir "$NIX_CACHE" \
              > "$RUNNER_TEMP/nix-cache.log" 2>&1 &
            echo "| DONE: Started binary cache server..."

            echo "> Waiting for binary cache server health..."
            ready=0
            for i in $(seq 1 60); do
              url="http://localhost:$port/nix-cache-info"
              echo ">> URL($i): $url"
              if curl --max-time 10 -sf "$url" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done

            if [[ $ready == 1 ]]; then
              echo "| OK: Binary cache server is ready..."
              echo "> Configuring nix to use binary cache server..."
              {
                echo "extra-substituters = http://localhost:$port?priority=1"
                echo "extra-trusted-public-keys = $ATTIC_KEY_PUB"
              } | sudo tee -a /etc/nix/nix.conf
              echo "> DONE: Configuring nix to use binary cache server..."

              echo "> Restarting Nix Daemon(2)..."
              sudo systemctl restart nix-daemon
              echo "| OK: Restarted Nix Daemon(2)..."
            else
              echo "::warning::Cache is not available. See logs below:"
              cat "$RUNNER_TEMP/proxy.log"
            fi
          fi
        '

    - name: Cache node modules
      if: ${{ inputs.skip-install != 'true'}}
      uses: actions/cache@v5
      with:
        path: .pnpm
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Instal node modules
      if: ${{ inputs.skip-install != 'true'}}
      shell: devenv shell -- bash -e {0}
      env:
        SECRETSPEC_PROFILE: ${{ inputs.profile }}
        SOPS_AGE_KEY: ${{ inputs.age-key }}

      run: |
        # No need to run install, devenv shell does it already
        echo "Ready..."
