name: "CI/CD"

on:
  push:
    branches:
      - main # Deploy on staging
    tags:
      - "prod@*" # Deploy on production

concurrency:
  group: ci-cd
  cancel-in-progress: false

env:
  NODE_ENV: "production"
  SECRETSPEC_PROFILE: &secretspec_profile >-
    ${{ github.ref == 'refs/heads/main' && 'staging' ||
        startsWith(github.ref, 'refs/tags/prod@') && 'prod' ||
        'ci' }}
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  checks:
    name: Run quality checks
    permissions:
      contents: write
    uses: ./.github/workflows/quality.yml
    with:
      hash-check: true
      gitref: ${{ github.event.before }}
      profile: *secretspec_profile
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  deploy-services:
    name: Deploy services on cloud
    needs: checks
    if: needs.checks.outputs.services != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.checks.outputs.services) }}
    uses: ./.github/workflows/cd-srv.yml
    with:
      service: ${{ matrix.service }}
      profile: *secretspec_profile
    secrets: inherit

  deploy-apps:
    name: Deploy apps on cloud
    needs: [checks, deploy-services]
    if: >-
      always() && 
      needs.checks.result == 'success' &&
      needs.checks.outputs.apps != '[]' &&
      (needs.deploy-services.result == 'success' || needs.deploy-services.result == 'skipped' )
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.checks.outputs.apps) }}
    uses: ./.github/workflows/cd-app.yml
    with:
      app: ${{ matrix.app }}
      profile: *secretspec_profile
    secrets: inherit

  sync-cloud:
    name: Sync cloud resources
    needs: [deploy-services]
    uses: ./.github/workflows/cd-cloud.yml
    with:
      profile: *secretspec_profile
    secrets: inherit
