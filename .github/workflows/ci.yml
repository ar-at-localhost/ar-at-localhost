name: "Continuous Integration"

on:
  push:
    branches:
      - main

jobs:
  quality-checks:
    name: Perform quality checks
    uses: ./.github/workflows/quality.yml
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  change-detection:
    name: Detect changed packages for staging deployment
    needs: quality-checks
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed-apps-detection.outputs.apps }}
      services: ${{ steps.changed-services-detection.outputs.services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv nixpkgs#sops

      - name: Detect changed services
        id: changed-services-detection
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        shell: devenv shell -- bash -e {0}
        run: |
          services=$(
            pnpm turbo ls --affected --output json |
              jq -c '[.packages.items[].name | select(test("^srv-"))]'
          )
          echo "services=${services}" >> "$GITHUB_OUTPUT"

      - name: Detect changed apps
        id: changed-apps-detection
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        shell: devenv shell -- bash -e {0}
        run: |
          apps=$(
            pnpm turbo ls --affected --output json |
              jq -c '[.packages.items[].name | select(test("^app-"))]'
          )
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

  deploy-services:
    name: Deploy services on cloud
    needs: change-detection
    if: needs.change-detection.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.change-detection.outputs.services) }}
    uses: ./.github/workflows/cd-srv.yml
    with:
      service: ${{ matrix.service }}
      profile: "staging"
    secrets: inherit

  deploy-apps:
    name: Deploy apps on cloud
    needs: [change-detection, deploy-services]
    if: needs.change-detection.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.change-detection.outputs.apps) }}
    uses: ./.github/workflows/cd-app.yml
    with:
      app: ${{ matrix.app }}
      profile: "staging"
    secrets: inherit

  sync-cloud:
    name: Sync cloud resources
    needs: [deploy-services]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv nixpkgs#sops

      - name: Sync Cloud
        env:
          SECRETSPEC_PROFILE: "staging"
          NODE_ENV: "production"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        shell: devenv shell -- bash -e {0}
        run: |
          devenv tasks run "aal:sync-cloud"
