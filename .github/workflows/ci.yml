name: "CI/CD"

on:
  push:
    branches:
      - main # Deploy on staging
    tags:
      - "prod@*" # Deploy on production

concurrency:
  group: ci-cd
  cancel-in-progress: false

env:
  NODE_ENV: "production"
  SECRETSPEC_PROFILE: &secretspec_profile >-
    ${{ github.ref == 'refs/heads/main' && 'staging' ||
        startsWith(github.ref, 'refs/tags/prod@') && 'prod' ||
        'ci' }}
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  quality-checks:
    name: Perform quality checks
    uses: ./.github/workflows/quality.yml
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  change-detection:
    name: Detect changed packages for deployment
    needs: quality-checks
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed-apps-detection.outputs.apps }}
      services: ${{ steps.changed-services-detection.outputs.services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Determine change references
        shell: devenv shell -- bash -e {0}
        env:
          TURBO_SCM_HEAD: ${{ github.sha }}
          TURBO_SCM_BASE: ${{ github.event.before }}
        run: |
          if [[ "$SECRETSPEC_PROFILE" == "prod" ]]; then
            current="$GITHUB_REF_NAME"

            base=$(git tag --list 'prod@*' --sort=-version:refname \
              | grep -Fxv "$current" \
              | head -n 1
            ) || true

            if [[ -z "$base" ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi

            TURBO_SCM_BASE="$base"
          fi

          echo "TURBO_SCM_HEAD=$TURBO_SCM_HEAD" >> "$GITHUB_ENV"
          echo "TURBO_SCM_BASE=$TURBO_SCM_BASE" >> "$GITHUB_ENV"

      - name: Detect changed services
        id: changed-services-detection
        shell: devenv shell -- bash -e {0}
        run: |
          services=$(
            pnpm turbo ls --affected --output json |
              jq -c '[.packages.items[].name | select(test("^srv-"))]'
          )
          echo "services=${services}" >> "$GITHUB_OUTPUT"

      - name: Detect changed apps
        id: changed-apps-detection
        shell: devenv shell -- bash -e {0}
        run: |
          apps=$(
            pnpm turbo ls --affected --output json |
              jq -c '[.packages.items[].name | select(test("^app-"))]'
          )
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/nix-cache
        if: always()

  deploy-services:
    name: Deploy services on cloud
    needs: change-detection
    if: needs.change-detection.outputs.services != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.change-detection.outputs.services) }}
    uses: ./.github/workflows/cd-srv.yml
    with:
      service: ${{ matrix.service }}
      profile: *secretspec_profile
    secrets: inherit

  deploy-apps:
    name: Deploy apps on cloud
    needs: [change-detection, deploy-services]
    if: >-
      always() && 
      needs.change-detection.result == 'success' &&
      needs.change-detection.outputs.apps != '[]' &&
      (needs.deploy-services.result == 'success' || needs.deploy-services.result == 'skipped' )
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.change-detection.outputs.apps) }}
    uses: ./.github/workflows/cd-app.yml
    with:
      app: ${{ matrix.app }}
      profile: *secretspec_profile
    secrets: inherit

  sync-cloud:
    name: Sync cloud resources
    needs: [deploy-services]
    uses: ./.github/workflows/cd-cloud.yml
    with:
      profile: *secretspec_profile
    secrets: inherit
