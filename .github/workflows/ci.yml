name: "Continuous Integration"

on:
  push:
    branches:
      - main

jobs:
  quality-checks:
    uses: "ar-at-localhost/ar-at-localhost/.github/workflows/quality.yml@main"
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  change-detection:
    needs: quality-checks
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed-apps-detection.outputs.apps }}
      services: ${{ steps.changed-services-detection.outputs.services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Detect changed services
        id: changed-services-detection
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          nix develop -c bash -euo pipefail -s <<'EOF'
          services=$(
            pnpm turbo ls --affected --output json |
              jq -c '[.packages.items[].name | select(test("^srv-"))]'
          )
          echo "services=${services}" >> "$GITHUB_OUTPUT"
          EOF

      - name: Detect changed apps
        id: changed-apps-detection
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          nix develop -c bash -euo pipefail -s <<'EOF'
          apps=$(
            pnpm turbo ls --affected --output json |
              jq -c '[.packages.items[].name | select(test("^app-"))]'
          )
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          EOF

  deploy-services:
    needs: change-detection
    if: needs.change-detection.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.change-detection.outputs.services) }}
    uses: ./.github/workflows/cd-srv.yml
    with:
      service: ${{ matrix.service }}
      profile: "staging"
    secrets: inherit

  deploy-apps:
    needs: change-detection
    if: needs.change-detection.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.change-detection.outputs.apps) }}
    uses: ./.github/workflows/cd-app.yml
    with:
      app: ${{ matrix.app }}
      profile: "staging"
    secrets: inherit

  deploy-gateway-config:
    needs: [deploy-services]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update API gateway
        env:
          SECRETSPEC_PROFILE: "staging"
          NODE_ENV: "production"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          nix develop -c secretspec run -- bash -c '
            nix run .#tofu-view > config.tf.json
            tofu apply -auto-approve -target "google_api_gateway_api_config.services"
          '
