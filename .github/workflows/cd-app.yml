name: "Continuous Site Deployment"

on:
  push:
    tags:
      - "app-*"

  workflow_dispatch:
    inputs: &deployment_inputs
      app:
        required: true
        type: string

      profile:
        default: "staging"
        type: string

  workflow_call:
    inputs: *deployment_inputs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Write Google Credentials
        env:
          SECRETSPEC_PROFILE: ${{ inputs.profile || 'prod' }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop -c secretspec run -- bash -euo pipefail -c '
            credentials="$1"
            echo "$GOOGLE_CREDENTIALS" > "$credentials"
          ' -- "$RUNNER_TEMP/gcp.json"

      - name: Deploy application
        env:
          SECRETSPEC_PROFILE: ${{ inputs.profile || 'prod' }}
          NODE_ENV: "production"
          APP: ${{ inputs.app || github.ref_name }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          export app="${APP%@*}"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp.json"

          # shellcheck disable=SC2016
          nix develop -c secretspec run -- bash -euo pipefail -c '
            pnpm turbo --filter "$app" build
            pnpm --filter "$app" firebase --project "$SECRETSPEC_PROFILE" deploy
          '
