name: "Continuous Site Deployment"

on:
  push:
    tags:
      - "app-*"

  workflow_dispatch:
    inputs: &deployment_inputs
      app:
        required: true
        type: string

      profile:
        default: "staging"
        type: string

  workflow_call:
    inputs: *deployment_inputs

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv nixpkgs#sops

      - name: Write Google Credentials
        env:
          SECRETSPEC_PROFILE: ${{ inputs.profile || 'prod' }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        shell: devenv shell -- bash -e {0}
        run: |
          export credentials_file="$RUNNER_TEMP/gcp.json"
          # shellcheck disable=SC2016
          devenv shell secretspec run -- bash -euo pipefail -c '
            echo "$GOOGLE_CREDENTIALS" > "$ credentials_file"
          '

      - name: Deploy application
        env:
          SECRETSPEC_PROFILE: ${{ inputs.profile || 'prod' }}
          NODE_ENV: "production"
          APP: ${{ inputs.app || github.ref_name }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          export APP="${APP%@*}"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp.json"
          devenv tasks run "aal:deploy-app"
