name: "Continuous Site Deployment"

on:
  push:
    tags:
      - "app-*"

  workflow_dispatch:
    inputs: &deployment_inputs
      app:
        required: true
        type: string

      profile:
        default: "staging"
        type: string

  workflow_call:
    inputs: *deployment_inputs

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          profile: ${{ inputs.profile }}

      - name: Deploy application
        env:
          SECRETSPEC_PROFILE: ${{ inputs.profile || 'prod' }}
          NODE_ENV: "production"
          APP: ${{ inputs.app || github.ref_name }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        shell: devenv shell --profile cloud -- bash -e {0}
        run: |
          export APP="${APP%@*}"
          devenv --profile cloud tasks run "aal:deploy-app"
