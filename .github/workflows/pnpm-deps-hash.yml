name: "pnpm Deps Hash Check"

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SOPS_AGE_KEY:
        required: true

permissions: {}

jobs:
  hash-check:
    name: Verify Nix hash for pnpm dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: ./.github/actions/setup-nix
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Check & Test
        id: hash_check
        env:
          SECRETSPEC_PROFILE: "ci"
          NODE_ENV: ci
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        shell: devenv shell -- bash -e {0}
        run: |
          devenv tasks run "aal:pnpm-hash"

      - uses: ./.github/actions/nix-cache
