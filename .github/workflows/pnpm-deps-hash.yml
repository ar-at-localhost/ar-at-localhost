name: "pnpm Deps Hash Check"

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SOPS_AGE_KEY:
        required: true

permissions: {}

jobs:
  hash-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check & Test
        id: hash_check
        env:
          SECRETSPEC_PROFILE: "ci"
          MONGODB_DB: "test_db_${{ github.run_id }}"
          NODE_ENV: ci
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          # shellcheck disable=SC2016
          nix develop -c secretspec run -- bash -c '
            hash_path="nix/hash.txt"
            specified_hash="$(cat "$hash_path")"
            got_hash=$(nix run .#pnpm-hash)

            if [[ -n "$got_hash" && "$specified_hash" != "$got_hash" ]]; then
              echo "$got_hash" > "$hash_path"
              git add "$hash_path"
              git config user.name "$AUTHOR_NAME"
              git config user.email "$AUTHOR_EMAIL"
              git commit -m "fix(nix): update pnpm hash"
              git push --no-verify origin HEAD
              echo "pnpm Hash has been updated. Please pull to integrate first."
              exit 1
            fi
          '
