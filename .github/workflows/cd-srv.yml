name: "Continuous Service Deployment"

on:
  push:
    tags:
      - "srv-*"

  workflow_dispatch:
    inputs: &deployment_inputs
      service:
        required: true
        type: string

      profile:
        default: "staging"
        type: string

  workflow_call:
    inputs: *deployment_inputs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Deploy service
        env:
          SECRETSPEC_PROFILE: ${{ inputs.profile || 'prod' }}
          NODE_ENV: "production"
          SERVICE: ${{ inputs.service || github.ref_name }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          export service="${SERVICE%@*}"
          # shellcheck disable=SC2016
          nix develop -c secretspec run -- bash -euo pipefail -c '
            nix run .#tofu-view > config.tf.json
            tofu init -input=false
            nix run .#deploy-service "$service" "$SECRETSPEC_PROFILE"
          '
