name: "Continuous Service Deployment"

on:
  push:
    tags:
      - "srv-*"

  workflow_dispatch:
    inputs: &deployment_inputs
      service:
        required: true
        type: string

      profile:
        default: "staging"
        type: string

  workflow_call:
    inputs: *deployment_inputs

env:
  NODE_ENV: "production"
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

permissions: {}

jobs:
  deploy-service:
    name: Deploy service
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          profile: ${{ inputs.profile }}

      - name: Deploy service
        env:
          SERVICE: ${{ inputs.service || github.ref_name }}
          SECRETSPEC_PROFILE: ${{ inputs.profile }}
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: devenv shell --profile cloud -- bash -e {0}
        run: |
          export service="${SERVICE%@*}"
          devenv tasks --profile cloud run "aal:deploy-service"
          devenv tasks --profile cloud run "aal:tf" --input config="$service" --input apply=1
          url=$(gcloud run services describe srv-internal --project="$GCP_PROJECT" --region="$GCP_REGION" --format 'value(status.url)')
          url="$url/openapi.json"
          openapi="services/microservices/${service#srv-}/openapi.json"

          echo "> Fetching OpenAPI Specs at $url"
          curl --fail -sSL -H "Authorization: Bearer $(gcloud auth print-identity-token)" "$url" -o "$openapi"
          oxfmt --write "$openapi"

          if [[ -n "$(git status --porcelain -- "$openapi")" ]]; then
            echo "> Updating gateway"
            git add "$openapi"
            version=$(jq -r '.info.version' "$openapi")
            devenv tasks --secretspec-profile "$SECRETSPEC_PROFILE" --profile cloud run 'aal:tf' --input config="gateway" --input apply=1
            git config user.name "$AUTHOR_NAME"
            git config user.email "$AUTHOR_EMAIL"
            git commit -m "build($service): v${version}"
            git push --no-verify origin "HEAD:refs/heads/$GIT_BRANCH"
            echo "::notice::| ${service}@${version} released. Please pull changes."
          fi
