name: "Continuous Service Deployment"

on:
  push:
    tags:
      - "srv-*"

  workflow_dispatch:
    inputs: &deployment_inputs
      service:
        required: true
        type: string

      profile:
        default: "staging"
        type: string

  workflow_call:
    inputs: *deployment_inputs

env:
  NODE_ENV: "production"
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

permissions: {}

jobs:
  deploy-service:
    name: Deploy service
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      common: ${{ steps.service-deployment.outputs.common }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          profile: ${{ inputs.profile }}

      - name: Deploy service
        id: service-deployment
        env:
          SERVICE: ${{ inputs.service || github.ref_name }}
          SECRETSPEC_PROFILE: ${{ inputs.profile }}
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: devenv shell --profile cloud -- bash -e {0}
        run: |
          export service="${SERVICE%@*}"
          devenv tasks --profile cloud run "aal:deploy-service-image" --input name="$service" --input profile="$SECRETSPEC_PROFILE"
          export TF_VAR_srv_digest=$(cat "result-${service}.digest")
          devenv tasks --profile cloud run "aal:tf" --input config="$service" --input apply=1
