name: "Continuous Service Deployment"

on:
  push:
    tags:
      - "srv-*"

  workflow_dispatch:
    inputs: &deployment_inputs
      service:
        required: true
        type: string

      profile:
        default: "staging"
        type: string

  workflow_call:
    inputs: *deployment_inputs

env:
  NODE_ENV: "production"
  SECRETSPEC_PROFILE: ${{ inputs.profile || 'prod' }}
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  deploy-service:
    name: Deploy service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Authenticate Google Cloud
        shell: devenv shell -- bash -e {0}
        run: |
          export keyfile="$RUNNER_TEMP/gcp.json"
          # shellcheck disable=SC2016
          secretspec run -- bash -euo pipefail -c '
            printf '%s' "$GOOGLE_CREDENTIALS" > "$keyfile"
            gcloud auth activate-service-account --key-file "$keyfile" --quiet
          '

      - name: Deploy service
        env:
          SERVICE: ${{ inputs.service || github.ref_name }}
        shell: devenv shell --profile cloud -- bash -e {0}
        run: |
          export SERVICE="${SERVICE%@*}"
          devenv tasks --profile cloud run "aal:deploy-service"

      - uses: ./.github/actions/nix-cache
