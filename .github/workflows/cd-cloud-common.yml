name: "Sync Cloud Common"

on:
  workflow_dispatch:

env:
  NODE_ENV: "production"
  SECRETSPEC_PROFILE: "prod"
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          profile: ${{ env.SECRETSPEC_PROFILE }}

      - name: Sync Cloud Common
        shell: devenv shell --profile cloud -- bash -e {0}
        run: |
          export TF_TARGET="common"
          devenv tasks --profile cloud run --quiet "aal:sync-cloud"
