name: "Continuous Cloud Sync"

on:
  push:
    tags:
      - "srv-*"

  workflow_dispatch:
    inputs: &deployment_inputs
      profile:
        default: "staging"
        type: string

  workflow_call:
    inputs: *deployment_inputs

env:
  NODE_ENV: "production"
  SECRETSPEC_PROFILE: ${{ inputs.profile || 'staging' }}
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  sync-cloud:
    name: Sync cloud resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-nix
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Sync Cloud
        shell: devenv shell --profile cloud -- bash -e {0}
        run: |
          devenv tasks --profile cloud run --quiet "aal:sync-cloud"

      - uses: ./.github/actions/nix-cache
