name: "Continuous Cloud Sync"

on:
  workflow_dispatch:
    inputs: &deployment_inputs
      profile:
        default: "staging"
        type: string
      templates:
        default: false
        type: boolean

  workflow_call:
    inputs: *deployment_inputs

env:
  NODE_ENV: "production"
  SECRETSPEC_PROFILE: ${{ inputs.profile || 'staging' }}
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  sync-cloud:
    name: Sync cloud resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          profile: ${{ inputs.profile }}

      - name: Sync Cloud
        shell: devenv shell --profile cloud -- bash -e {0}
        env:
          templates: ${{ inputs.templates }}
        run: |
          secretspec run pnpm --filter lib-server db:migrate
          secretspec run pnpm --filter lib-server db:seed
          devenv tasks --profile cloud run --quiet "aal:tf" --input config="default"

          if [[ "$templates" == "true" ]]; then
            gcloud storage rsync --recursive \
              --exclude '^(?!.*\.(css|html|md|txt)$).*' \
              packages/lib-server/src/templates "gs://${GCP_PROJECT}-server/templates"
          fi
