name: Version Packages

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  quality-checks:
    uses: "ar-at-localhost/ar-at-localhost/.github/workflows/quality.yml@main"
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  version:
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          # IMPORANT: Use PAT with this job so that pushed tags will eventually trigger other workflows.
          # When using Github Actions token -- it wouldn't trigger other flows based on tag push.
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: cachix/install-nix-action@v31

      - name: Version packages
        run: |
          nix develop -c pnpm changeset version

      - name: Commit versions
        uses: EndBug/add-and-commit@v11
        id: commit
        with:
          add: "."
          default_author: github_actions
          message: "ci: version packages"
          push: "--set-upstream origin main --no-verify"

      - name: Tag packages
        if: steps.commit.outputs.committed == 'true'
        run: |
          nix develop -c pnpm changeset git-tag
          git push origin --no-verify --tags
