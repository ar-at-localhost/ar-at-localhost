name: "Quality Checks"

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SOPS_AGE_KEY:
        required: true
    outputs:
      services:
        value: ${{ jobs.check.outputs.services }}
      apps:
        value: ${{ jobs.check.outputs.apps }}

env:
  SECRETSPEC_PROFILE: "ci"
  DB_ID: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
  NODE_ENV: ci

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.change-detection.outputs.apps }}
      services: ${{ steps.change-detection.outputs.services }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          profile: ${{ env.SECRETSPEC_PROFILE }}

      - name: Format / Lint / Type-Check / Build / Test
        shell: devenv shell -- bash -e {0}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          export DB_NAME="$DB_ID"
          devenv tasks run "aal:test"

      - uses: ./.github/actions/change-detection
        id: change-detection
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          profile: ${{ env.SECRETSPEC_PROFILE }}
