name: "Quality Checks"

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SOPS_AGE_KEY:
        required: true

env:
  SECRETSPEC_PROFILE: "ci"
  DB_ID: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
  NODE_ENV: ci

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Check & Test
        shell: devenv shell -- bash -e {0}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          export DB_NAME="$DB_ID"
          devenv tasks run "aal:test"

      - uses: ./.github/actions/nix-cache
