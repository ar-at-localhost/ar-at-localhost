name: "Site Deployment"

on:
  push:
    tags:
      - site@*

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Deploy site on DigitalOcean
        env:
          SECRETSPEC_PROFILE: "ci"
          MONGODB_DB: "test_db_${{ github.run_id }}"
          NODE_ENV: ci
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          nix develop -c secretspec run -- bash -euo pipefail -c '
            doctl app cd "$SITE_APP_ID" \
              --access-token "$DOCTL_TOKEN"
          '
