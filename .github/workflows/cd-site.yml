name: "Site Deployment"

on:
  push:
    tags:
      - site@*

jobs:
  quality-checks:
    uses: "ar-at-localhost/ar-at-localhost/.github/workflows/quality.yml@main"
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  deploy:
    needs: [quality-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Check & Test
        env:
          SECRETSPEC_PROFILE: "ci"
          MONGODB_DB: "test_db_${{ github.run_id }}"
          NODE_ENV: ci
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          nix develop -c doctl app update "$SITE_APP_ID" \
          --access-token "$DOCTL_TOKEN" \
          --spec "apps/site/.do/app.yaml"
