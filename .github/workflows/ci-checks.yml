name: "Continuous Integration Checks"

on:
  pull_request:
    branches:
      - main

jobs:
  pnpm-hash:
    uses: ./.github/workflows/pnpm-deps-hash.yml
    permissions:
      contents: write
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  quality-checks:
    needs: pnpm-hash
    uses: ./.github/workflows/quality.yml
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
