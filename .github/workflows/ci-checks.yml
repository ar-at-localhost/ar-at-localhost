name: "Continuous Integration Checks"

on:
  pull_request:
    branches:
      - main

env:
  SECRETSPEC_PROFILE: ci

permissions: {}

jobs:
  approval:
    uses: ./.github/workflows/approval.yml

  checks:
    needs: approval
    if: ${{ !cancelled() && needs.approval.result != 'failure' }}
    name: Run quality checks
    permissions:
      contents: write
    uses: ./.github/workflows/quality.yml
    with:
      hash-check: true
      gitref: ${{ github.event.before }}
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
