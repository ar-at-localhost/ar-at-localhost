name: "API Deployment"

on:
  push:
    tags:
      - "api@*"

concurrency:
  group: cd-api
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Deploy to server
        env:
          SECRETSPEC_PROFILE: "ci"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          nix develop -c secretspec run -- bash -euo pipefail -c '
            install -d -m 0700 ~/.ssh
            install -m 600 /dev/null ~/.ssh/srv-key
            printf "%s\n" "$SRV_SSH_KEY" > ~/.ssh/srv-key
            GIT_SSH_COMMAND="ssh -i $HOME/.ssh/srv-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push "ssh://$SRV_SSH_USER@$SRV_SSH_HOST/$SRV_SSH_PATH" "$GITHUB_REF"
          '
